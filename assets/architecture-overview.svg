<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Maxilun v1.3.0 Ecosystem Architecture</title>
  <desc id="arch-desc">Four-layer architecture schematic of Maxilun v1.3.0: 1 master orchestrator, 26 domain specialists (27 skills), 21 autonomous agents, the AST knowledge graph, the four runtime engines, and automated verification gates.</desc>

  <rect width="1200" height="760" fill="#09090b" rx="12"/>

  <!-- Header -->
  <text x="44" y="56" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#f4f4f5">MAXILUN ECOSYSTEM ARCHITECTURE</text>
  <text x="44" y="80" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#94a3b8">v1.3.0  |  1 ORCHESTRATOR + 26 SPECIALISTS (27 SKILLS)  |  21 AUTONOMOUS AGENTS</text>

  <rect x="892" y="36" width="264" height="42" rx="6" fill="#111116" stroke="#27272a" stroke-width="1.5"/>
  <text x="912" y="61" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="600" fill="#818cf8">ALL 27 SKILL.MD &lt;= 300 LINES</text>

  <!-- Layer 1: Asymmetric Entry + AST Knowledge Graph -->
  <rect x="44" y="108" width="700" height="128" rx="8" fill="#111116" stroke="#818cf8" stroke-width="1.5"/>
  <text x="64" y="134" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#818cf8">LAYER 01  //  ORCHESTRATION &amp; REVERSIBILITY ROUTING</text>
  <rect x="506" y="118" width="220" height="26" rx="4" fill="#18181f" stroke="#27272a" stroke-width="1"/>
  <text x="518" y="135" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#cbd5e1">COGNITIVE CEILING: &lt;= 300 LINES</text>
  <text x="64" y="160" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#f4f4f5">maxilun (Master Orchestrator) + 4-Phase Council Protocol</text>
  <text x="64" y="185" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#cbd5e1">1. Domain classification &amp; wave sizing</text>
  <text x="380" y="185" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#cbd5e1">2. One primary owner via explicit routing</text>
  <text x="64" y="208" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94a3b8">3. Mandatory ACC gate &amp; lessons memory</text>
  <text x="380" y="208" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94a3b8">4. Real terminal exit-0 proof before completion</text>

  <rect x="760" y="108" width="396" height="128" rx="8" fill="#111116" stroke="#27272a" stroke-width="1.5"/>
  <text x="780" y="134" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#818cf8">AST KNOWLEDGE GRAPH (maxilun-kg)</text>
  <text x="780" y="160" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#f4f4f5">One-Call Symbol Navigation</text>
  <text x="780" y="185" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#cbd5e1">kg_locate · kg_query · kg_diff_impact</text>
  <text x="780" y="208" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94a3b8">defOf, callsIn, importersOf &amp; routesOf blast radius</text>

  <!-- Connector 1 -> 2 -->
  <line x1="600" y1="236" x2="600" y2="255" stroke="#818cf8" stroke-width="1.5"/>
  <polygon points="595,253 605,253 600,260" fill="#818cf8"/>

  <!-- Layer 2: 26 Domain Specialists across 4 domain-weighted clusters -->
  <rect x="44" y="260" width="1112" height="240" rx="8" fill="#111116" stroke="#27272a" stroke-width="1.5"/>
  <text x="64" y="286" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#818cf8">LAYER 02  //  26 DOMAIN SPECIALISTS  (27 SKILLS TOTAL · CORE-RULES LOCKED ACROSS ALL SKILLS)</text>

  <!-- Cluster A: Architecture & Backend (7) -->
  <rect x="64" y="302" width="280" height="180" rx="6" fill="#18181f" stroke="#27272a" stroke-width="1"/>
  <text x="80" y="325" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="600" fill="#818cf8">ARCHITECTURE &amp; DATA (7)</text>
  <text x="80" y="348" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-architect (contracts)</text>
  <text x="80" y="368" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-engineer (core logic)</text>
  <text x="80" y="388" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-data (SQL &amp; RLS)</text>
  <text x="80" y="408" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-ai (RAG &amp; evals)</text>
  <text x="80" y="428" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-scaffold (docs/ init)</text>
  <text x="80" y="448" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-knowledge-graph</text>
  <text x="80" y="468" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-insight (root cause)</text>

  <!-- Cluster B: Interface, Motion & Media (6) -->
  <rect x="360" y="302" width="250" height="180" rx="6" fill="#18181f" stroke="#27272a" stroke-width="1"/>
  <text x="376" y="325" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="600" fill="#818cf8">UI, MOTION &amp; MEDIA (6)</text>
  <text x="376" y="350" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-craft (UI &amp; 6 states)</text>
  <text x="376" y="372" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-frontend (Next/RSC)</text>
  <text x="376" y="394" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-figcraft (FigCraft MCP)</text>
  <text x="376" y="416" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-motion (WebGL/GSAP)</text>
  <text x="376" y="438" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-cinecode (Remotion)</text>
  <text x="376" y="460" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-content (microcopy)</text>

  <!-- Cluster C: Systems, Platforms & Edge (7) -->
  <rect x="626" y="302" width="296" height="180" rx="6" fill="#18181f" stroke="#27272a" stroke-width="1"/>
  <text x="642" y="325" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="600" fill="#818cf8">PLATFORMS &amp; SYSTEMS (7)</text>
  <text x="642" y="348" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-desktop (Win32/WPF/Qt)</text>
  <text x="642" y="368" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-mobile (iOS/Android/RN)</text>
  <text x="642" y="388" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-game (Unreal/Unity/Godot)</text>
  <text x="642" y="408" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-iot (ESP32/STM32/MQTT)</text>
  <text x="642" y="428" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-network (RouterOS/VPN)</text>
  <text x="642" y="448" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-deploy (CI/CD &amp; TLS)</text>
  <text x="642" y="468" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-n8n (webhooks &amp; v1 JSON)</text>

  <!-- Cluster D: Security, Docs & QA (6) -->
  <rect x="938" y="302" width="200" height="180" rx="6" fill="#18181f" stroke="#27272a" stroke-width="1"/>
  <text x="954" y="325" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="600" fill="#818cf8">SECURITY &amp; QA (6)</text>
  <text x="954" y="350" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-sentinel</text>
  <text x="954" y="372" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-hunt</text>
  <text x="954" y="394" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-verify</text>
  <text x="954" y="416" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-docsmith</text>
  <text x="954" y="438" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-diagrams</text>
  <text x="954" y="460" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">maxilun-seo-audit</text>

  <!-- Connector 2 -> 3 -->
  <line x1="600" y1="500" x2="600" y2="519" stroke="#818cf8" stroke-width="1.5"/>
  <polygon points="595,517 605,517 600,524" fill="#818cf8"/>

  <!-- Layer 3: Four Always-On Engines (single pipeline bar with vertical dividers) -->
  <rect x="44" y="524" width="1112" height="122" rx="8" fill="#111116" stroke="#27272a" stroke-width="1.5"/>
  <text x="64" y="548" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#818cf8">LAYER 03  //  FOUR ALWAYS-ON RUNTIME ENGINES</text>

  <text x="64" y="576" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#f4f4f5">1. Focus &amp; Agency</text>
  <text x="64" y="598" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">Reversibility gates, AST scope</text>
  <text x="64" y="618" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94a3b8">&amp; verified code evidence only</text>

  <line x1="330" y1="560" x2="330" y2="630" stroke="#27272a" stroke-width="1.5"/>

  <text x="350" y="576" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#f4f4f5">2. Purity (Anti-Slop)</text>
  <text x="350" y="598" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">6 UI states, WCAG AA contrast,</text>
  <text x="350" y="618" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94a3b8">zero emojis &amp; clean typography</text>

  <line x1="606" y1="560" x2="606" y2="630" stroke="#27272a" stroke-width="1.5"/>

  <text x="626" y="576" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#f4f4f5">3. Surgical Discipline</text>
  <text x="626" y="598" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">Minimal diffs, zero drive-by</text>
  <text x="626" y="618" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94a3b8">edits &amp; strict root confinement</text>

  <line x1="880" y1="560" x2="880" y2="630" stroke="#27272a" stroke-width="1.5"/>

  <text x="900" y="576" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#f4f4f5">4. Clarity Engine</text>
  <text x="900" y="598" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">Root-cause diagnosis, concise</text>
  <text x="900" y="618" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94a3b8">summaries &amp; live terminal proof</text>

  <!-- Layer 4: Verification & Autonomous Fleet -->
  <rect x="44" y="666" width="640" height="66" rx="8" fill="#111116" stroke="#27272a" stroke-width="1.5"/>
  <text x="64" y="690" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#34d399">LAYER 04  //  CI VALIDATION &amp; PURITY GATES</text>
  <text x="64" y="714" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#cbd5e1">test-suite.py  |  ui-purity-linter.py  |  slopscan.py  |  verify_engine.py  |  council_hook.py</text>

  <rect x="700" y="666" width="456" height="66" rx="8" fill="#111116" stroke="#27272a" stroke-width="1.5"/>
  <text x="720" y="690" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#818cf8">AUTONOMOUS FLEET (21 AGENTS IN agents/)</text>
  <text x="720" y="714" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">orchestrator · scout · architect · ui-reviewer · security · verifier + 15</text>
</svg>
