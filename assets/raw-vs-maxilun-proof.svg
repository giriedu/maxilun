<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" width="1160" height="600" role="img" aria-labelledby="proof-title proof-desc">
  <title id="proof-title">Raw LLM Prompting vs Maxilun Harness v1.3.0</title>
  <desc id="proof-desc">Structural comparison contrasting an unconstrained raw prompt ledger against the Maxilun v1.3.0 harness: 6 UI states, AST navigation, 300-line cognitive budget, confinement hooks, and terminal verification gates.</desc>

  <rect width="1160" height="600" fill="#09090b" rx="12"/>

  <!-- Header -->
  <text x="44" y="56" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#f4f4f5">RAW LLM PROMPTING vs. MAXILUN HARNESS (v1.3.0)</text>
  <text x="44" y="80" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8">Observed structural differences across symbol lookup, 6-state UI completeness, write confinement, and verification proof</text>

  <!-- Left Panel (430px): Single-Column Failure Ledger -->
  <rect x="44" y="108" width="430" height="452" rx="8" fill="#111116" stroke="#27272a" stroke-width="1.5"/>
  <text x="64" y="136" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#f87171">BASELINE  //  UNCONSTRAINED RAW PROMPT</text>
  <line x1="64" y1="150" x2="454" y2="150" stroke="#27272a" stroke-width="1.5"/>

  <text x="64" y="176" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#94a3b8">01  CONTEXT EXPLORATION</text>
  <text x="64" y="198" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#f4f4f5">Recursive grep &amp; blind file reads</text>
  <text x="64" y="216" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">Burns tokens before locating exact symbol callers</text>
  <line x1="64" y1="232" x2="454" y2="232" stroke="#27272a" stroke-width="1"/>

  <text x="64" y="254" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#94a3b8">02  UI &amp; STATE COVERAGE</text>
  <text x="64" y="276" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#f4f4f5">Happy-path mock UI with AI slop</text>
  <text x="64" y="294" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">Omits Empty, Loading, Pending &amp; Error states; adds emojis</text>
  <line x1="64" y1="310" x2="454" y2="310" stroke="#27272a" stroke-width="1"/>

  <text x="64" y="332" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#94a3b8">03  GOVERNANCE &amp; CONFINEMENT</text>
  <text x="64" y="354" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#f4f4f5">Silent cross-module mutations</text>
  <text x="64" y="372" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">Shell chains &amp; symlinks bypass weak path checks</text>
  <line x1="64" y1="388" x2="454" y2="388" stroke="#27272a" stroke-width="1"/>

  <text x="64" y="410" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#94a3b8">04  INSTRUCTION BUDGET</text>
  <text x="64" y="432" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#f4f4f5">Monolithic 800+ line prompts</text>
  <text x="64" y="450" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">Middle-context decay drops critical invariants</text>
  <line x1="64" y1="466" x2="454" y2="466" stroke="#27272a" stroke-width="1"/>

  <text x="64" y="492" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#94a3b8">05  COMPLETION DISCIPLINE</text>
  <text x="64" y="516" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#f87171">Self-asserted "done" without command output</text>
  <text x="64" y="536" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">Regressions surface only after user delivery</text>

  <!-- Right Panel (626px): Structured Multi-Zone Control Schematic -->
  <rect x="490" y="108" width="626" height="452" rx="8" fill="#111116" stroke="#818cf8" stroke-width="1.5"/>
  <text x="510" y="136" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#34d399">ENFORCED  //  MAXILUN HARNESS &amp; PURITY GATES</text>

  <!-- Zone A: Top 6-UI-State Telemetry Strip -->
  <rect x="510" y="150" width="586" height="64" rx="6" fill="#18181f" stroke="#27272a" stroke-width="1"/>
  <text x="526" y="173" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="600" fill="#818cf8">MANDATORY 6-STATE SURFACE TOPOLOGY</text>
  <text x="526" y="197" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#f4f4f5">01 Idle  |  02 Loading  |  03 Populated (tabular-nums)  |  04 Empty+CTA  |  05 Pending  |  06 Error</text>

  <!-- Zone B: Asymmetric Mid Split (310px left / 260px right) -->
  <rect x="510" y="228" width="310" height="190" rx="6" fill="#18181f" stroke="#27272a" stroke-width="1"/>
  <text x="526" y="252" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="600" fill="#818cf8">AST GRAPH &amp; COGNITIVE BUDGET</text>
  <text x="526" y="278" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#f4f4f5">One-Call Symbol Navigation</text>
  <text x="526" y="304" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">kg_locate &amp; kg_diff_impact map callers first</text>
  <text x="526" y="328" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">All 27 SKILL.md kept &lt;= 300 lines</text>
  <text x="526" y="352" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">All 21 agents/*.md kept &lt;= 200 lines</text>
  <text x="526" y="376" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94a3b8">Shared lessons in .maxilun/lessons.jsonl</text>
  <text x="526" y="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#818cf8">Single primary specialist per wave</text>

  <rect x="836" y="228" width="260" height="190" rx="6" fill="#18181f" stroke="#27272a" stroke-width="1"/>
  <text x="852" y="252" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="600" fill="#818cf8">SECURITY &amp; ACC HOOKS</text>
  <text x="852" y="278" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#f4f4f5">Fail-Closed Enforcement</text>
  <text x="852" y="304" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">Explicit ACC gate before edits</text>
  <text x="852" y="328" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">Workspace &amp; symlink confinement</text>
  <text x="852" y="352" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">Quote-balanced shell tokenizer</text>
  <text x="852" y="376" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94a3b8">Blocked .env &amp; key read/writes</text>
  <text x="852" y="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#818cf8">Isolated API keys per provider</text>

  <!-- Zone C: Bottom Verification & Purity Footer -->
  <rect x="510" y="432" width="586" height="110" rx="6" fill="#18181f" stroke="#27272a" stroke-width="1"/>
  <text x="526" y="456" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="600" fill="#34d399">MECHANICAL PURITY &amp; TERMINAL PROOF (ZERO FAKE PASSES)</text>
  <text x="526" y="482" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#f4f4f5">Automated Linters + Headless Browser Reflow + Test Suite</text>
  <text x="526" y="505" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1">ui-purity-linter.py &amp; slopscan.py block emojis, low contrast &amp; SVG XSS</text>
  <text x="526" y="525" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#94a3b8">verify_engine.py checks DOM &amp; Playwright mobile/desktop overflow before sign-off</text>
</svg>
