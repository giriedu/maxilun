name: Create GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract section for this version from CHANGELOG.md
          python3 - <<'EOF'
          import re, sys

          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              content = f.read()

          version = "${{ steps.version.outputs.version }}"

          # Match section from ## [VERSION] to next ## [
          pattern = rf"## \[{re.escape(version)}\].*?(?=\n## \[|\Z)"
          match = re.search(pattern, content, re.DOTALL)

          if match:
              notes = match.group(0).strip()
              with open("release_notes.md", "w", encoding="utf-8") as out:
                  out.write(notes)
              print(f"Release notes extracted for v{version}")
          else:
              print(f"No changelog entry found for v{version}, using generic notes")
              with open("release_notes.md", "w", encoding="utf-8") as out:
                  out.write(f"## [{version}]\n\nSee [CHANGELOG.md](CHANGELOG.md) for full details.")
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Maxilun ${{ steps.version.outputs.tag }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
